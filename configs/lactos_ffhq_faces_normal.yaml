# LACToS, FFHQ set 'faces_normal' (50 anomaly-free FFHQ faces (all-zero masks); ADM + DPS reconstructions, 20 seeds) at the paper's
# setting: superpixels 20 px, 20 draws, histogram sigma 1, 16 x 32 bins. The paper's FFHQ score is
# intensity + 0.25 x feature term: scripts/score_lactos.sh runs this config twice (as is, and with --no_pca)
# and scripts/make_table1.py mixes the two dumps. Paths are relative to the repository root (assets/ = the
# extracted bundle); every value can be overridden on the command line (evaluate.py --help).
sampling: {enabled: false, num_patches: 1}

data:
  category: faces
  subcategory: random
  image_dir: assets/data/ffhq/faces_normal/test
  results_dir: assets/recons/results_patches_adm_dps_faces_normal
  test_origin: adm_dps_whole
  bottom_suffix: "4"
  figures_dir: results/figures           # superpixel-mask cache
  gt_mask:
    path: "assets/data/ffhq/faces_normal/ground_truth/{sample}_mask.png"
    downsample_factor: 1

embeddings:
  backbone: resnet101          # torchvision ResNet, layers 1-3 with 3x3 patch context (1792 dims)
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda
  batch_size: 4                # embedding batch; changes float32 round-off, so keep the paper's value (FFHQ 4, CT and X-ray default 16)

pca: {n_components: 3}         # autoencoder latent size

superpixels:
  target_size: 20               # average superpixel size in pixels (paper Table 5)
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0

scoring:
  bins_rgb: 16                 # intensity histogram bins
  bins_pca: 32                 # feature histogram bins (per latent dimension)
  smooth_sigma: 1.0             # histogram smoothing sigma, in bins
  min_pixels: 2
  use_pca: true                # feature term on/off (lambda > 0 / lambda = 0); --no_pca turns it off
  autoencoder_path: assets/checkpoints/lactos/ae_faces.pth
  ae_encode: direct              # how the latents are computed (CHAOS: folded, FFHQ: direct; see docs/HYPERPARAMETERS.md)

eval:
  output_dir: results/lactos_json/ffhq/faces_normal               # per-set summary JSON
  dump_maps_dir: results/lactos_maps/ffhq/sp20_m20_hs1_b16x32/faces_normal            # one <sample>.npz per image (what scripts/make_table1.py reads)
