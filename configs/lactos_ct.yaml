# LACToS, CHAOS (CT) at the paper's setting: superpixels 100 px, 5 draws, histogram sigma 0.5, 16 x 64 bins, lambda = 1.
# Describes the anomalous set (cta); scripts/score_lactos.sh runs the normal set (ctn) with
# --subcategory ctn --results_dir ... --image_dir ... . Paths are relative to the repository root
# (assets/ = the extracted bundle); every value can be overridden on the command line (evaluate.py --help).
# category "CT" selects the CT branch of evaluate.py: grayscale histogram, lesion masks and body masks
# from $OOD_CT_MASK_ROOT (default assets/data/CT/masks).
sampling: {enabled: false, num_patches: 1}

data:
  category: CT
  subcategory: cta
  image_dir: assets/data/CT/test/cta
  results_dir: assets/recons/results_patches_ddad_native_CT_cta
  test_origin: ddad_native
  bottom_suffix: "4"
  figures_dir: results/figures           # superpixel-mask cache
  gt_mask:
    path: "assets/data/CT/masks/masks_ood_med_med/{sample}_mask.png"
    downsample_factor: 1

embeddings:
  backbone: resnet101          # torchvision ResNet, layers 1-3 with 3x3 patch context (1792 dims)
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda

pca: {n_components: 3}         # autoencoder latent size

superpixels:
  target_size: 100               # average superpixel size in pixels (paper Table 5)
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0

scoring:
  bins_rgb: 16                 # intensity histogram bins
  bins_pca: 64                 # feature histogram bins (per latent dimension)
  smooth_sigma: 0.5             # histogram smoothing sigma, in bins
  min_pixels: 2
  use_pca: true                # feature term on/off (lambda > 0 / lambda = 0); --no_pca turns it off
  autoencoder_path: assets/checkpoints/lactos/ae_CT.pth
  ae_encode: folded              # how the latents are computed (CHAOS: folded, FFHQ: direct; see docs/HYPERPARAMETERS.md)

eval:
  output_dir: results/lactos_json/CT/cta               # per-set summary JSON
  dump_maps_dir: results/lactos_maps/CT/sp100_m5_hs0.5_b16x64/cta            # one <sample>.npz per image (what scripts/make_table1.py reads)
