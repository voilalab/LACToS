# LACToS evaluation config for CHAOS CT (anomalous = cta, normal = ctn; lesion/body masks via OOD_CT_MASK_ROOT). Per-cell flags (bins, superpixel size, histogram sigma, AE)
# are passed on the command line by scripts/20_score_lactos.sh; this file holds the data layout
# and the fixed pipeline settings. Paths are relative to the repository root (assets/ = extracted bundle).
sampling:
  enabled: false
  num_patches: 1

data:
  image_dir: assets/data/CT/test/cta
  figures_dir: results/figures
  results_dir: assets/recons/results_patches_ddad_native_CT_cta
  sample_name: samples_image_0000
  test_origin: ddad_native
  bottom_suffix: "4"
  gt_mask:
    path: assets/data/CT/masks/masks_ood_med_med/{sample}_mask.png
    downsample_factor: 1

embeddings:
  backbone: resnet101
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda

pca: {n_components: 3}

superpixels:
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0
  target_size: 30

scoring:
  bins_rgb: 32
  bins_pca: 32
  smooth_sigma: 1.0
  min_pixels: 2

eval:
  output_dir: results/lactos_json
