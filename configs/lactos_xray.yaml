# LACToS, DVXray (scissors) at the paper's setting: superpixels 10 px, 20 draws, no histogram smoothing,
# 16 intensity bins, lambda = 0 (intensity-only score: use_pca false, the autoencoder is not used).
# Describes the anomalous set (xrsc); scripts/score_lactos.sh runs the weapon-free set (xrgd) with
# --subcategory xrgd --results_dir ... --image_dir ... --gt_root ... . Paths are relative to the repository
# root (assets/ = the extracted bundle); every value can be overridden on the command line (evaluate.py --help).
sampling: {enabled: false, num_patches: 1}

data:
  category: xray
  subcategory: xrsc
  image_dir: assets/data/xray/test/xrsc
  results_dir: assets/recons/results_patches_ddad_native_xray_xrsc
  test_origin: ddad_native
  bottom_suffix: "4"
  figures_dir: results/figures           # superpixel-mask cache
  gt_mask:
    path: "assets/data/xray/ground_truth/xrsc/{sample}_mask.png"
    downsample_factor: 1

embeddings:
  backbone: resnet101          # torchvision ResNet, layers 1-3 with 3x3 patch context (1792 dims)
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda

pca: {n_components: 3}         # autoencoder latent size

superpixels:
  target_size: 10               # average superpixel size in pixels (paper Table 5)
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0

scoring:
  bins_rgb: 16                 # intensity histogram bins
  bins_pca: 16                 # feature histogram bins (per latent dimension)
  smooth_sigma: 0             # histogram smoothing sigma, in bins
  min_pixels: 2
  use_pca: false                # feature term on/off (lambda > 0 / lambda = 0); --no_pca turns it off
  autoencoder_path: assets/checkpoints/lactos/ae_xray.pth
  ae_encode: direct              # how the latents are computed (CHAOS: folded, FFHQ: direct; see docs/HYPERPARAMETERS.md)

eval:
  output_dir: results/lactos_json/xray/xrsc               # per-set summary JSON
  dump_maps_dir: results/lactos_maps/xray/sp10_m20_hs0_rgbonly_b16/xrsc            # one <sample>.npz per image (what scripts/make_table1.py reads)
